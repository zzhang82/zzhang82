<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="AMB learning loop: fail, learn, recall, succeed">
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.t{font-size:22px;font-weight:700;fill:#cbd5e1}.h{font-size:15px;font-weight:700;fill:#e2e8f0}.s{font-size:12px;fill:#94a3b8}.b{fill:#0f172a;stroke:#475569;stroke-width:2}.amb{fill:#111827;stroke:#60a5fa;stroke-width:2.5}.bad{stroke:#f87171}.good{stroke:#4ade80}.line{stroke:#475569;stroke-width:2;stroke-linecap:round;stroke-dasharray:7 7}.p{fill:#f87171}.g{fill:#4ade80}.m{fill:#60a5fa}.dim{opacity:.25}.a1{animation:f 8s linear infinite}.a2{animation:f 8s 2s linear infinite}.a3{animation:f 8s 4s linear infinite}.a4{animation:f 8s 6s linear infinite}@keyframes f{0%,22%{opacity:1}25%,100%{opacity:.22}}@media(prefers-color-scheme:light){.t{fill:#0f172a}.h{fill:#1e293b}.s{fill:#64748b}.b{fill:#fff;stroke:#cbd5e1}.amb{fill:#f8fafc;stroke:#3b82f6}.line{stroke:#94a3b8}}
</style>
<text x="40" y="34" class="t">AMB: agents learn from failure without changing model weights</text>
<text x="40" y="55" class="s">reviewed experience becomes durable guidance for the next similar task</text>
<path d="M170 130H830" class="line"/>
<rect x="40" y="88" width="170" height="84" rx="14" class="b bad"/>
<text x="125" y="116" text-anchor="middle" class="h a1">1 · FAIL</text>
<text x="125" y="140" text-anchor="middle" class="s">agent repeats a</text><text x="125" y="157" text-anchor="middle" class="s">known project mistake</text>
<rect x="270" y="88" width="190" height="84" rx="14" class="b"/>
<text x="365" y="116" text-anchor="middle" class="h a2">2 · LEARN</text>
<text x="365" y="140" text-anchor="middle" class="s">stage gotcha → review</text><text x="365" y="157" text-anchor="middle" class="s">promote durable memory</text>
<rect x="520" y="76" width="190" height="108" rx="16" class="amb"/>
<text x="615" y="111" text-anchor="middle" class="h a3">3 · AMB RECALL</text>
<text x="615" y="136" text-anchor="middle" class="s">similar task detected</text><text x="615" y="153" text-anchor="middle" class="s">relevant rule restored</text>
<rect x="770" y="88" width="190" height="84" rx="14" class="b good"/>
<text x="865" y="116" text-anchor="middle" class="h a4">4 · SUCCEED</text>
<text x="865" y="140" text-anchor="middle" class="s">agent avoids the old</text><text x="865" y="157" text-anchor="middle" class="s">error automatically</text>
<circle r="7" class="p"><animateMotion dur="8s" repeatCount="indefinite" path="M170 130H270"/></circle>
<circle r="7" class="m"><animateMotion dur="8s" begin="2s" repeatCount="indefinite" path="M460 130H520"/></circle>
<circle r="7" class="g"><animateMotion dur="8s" begin="4s" repeatCount="indefinite" path="M710 130H770"/></circle>
<path d="M865 185C865 225 125 225 125 185" class="line dim"/>
<text x="495" y="229" text-anchor="middle" class="s">next task → recall first → fewer repeated mistakes</text>
</svg>