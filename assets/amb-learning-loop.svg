<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="AMB learning loop">
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.t{font-size:22px;font-weight:700;fill:#cbd5e1}.h{font-size:15px;font-weight:700;fill:#e2e8f0}.s{font-size:12px;fill:#94a3b8}.b{fill:#0f172a;stroke:#475569;stroke-width:2}.a{fill:#111827;stroke:#60a5fa;stroke-width:2.5}.l{stroke:#475569;stroke-width:2;stroke-dasharray:7 7}.bad{stroke:#f87171}.good{stroke:#4ade80}@media(prefers-color-scheme:light){.t{fill:#0f172a}.h{fill:#1e293b}.s{fill:#64748b}.b{fill:#fff;stroke:#cbd5e1}.a{fill:#f8fafc;stroke:#3b82f6}.l{stroke:#94a3b8}}</style>
<text x="40" y="34" class="t">AMB: agents learn from failure without changing model weights</text>
<text x="40" y="55" class="s">reviewed experience becomes durable guidance for the next similar task</text>
<path d="M170 130H830" class="l"/>
<rect x="40" y="88" width="170" height="84" rx="14" class="b bad"/><text x="125" y="116" text-anchor="middle" class="h">1 · FAIL</text><text x="125" y="140" text-anchor="middle" class="s">repeat known mistake</text>
<rect x="270" y="88" width="190" height="84" rx="14" class="b"/><text x="365" y="116" text-anchor="middle" class="h">2 · LEARN</text><text x="365" y="140" text-anchor="middle" class="s">review → durable gotcha</text>
<rect x="520" y="76" width="190" height="108" rx="16" class="a"/><text x="615" y="111" text-anchor="middle" class="h">3 · AMB RECALL</text><text x="615" y="140" text-anchor="middle" class="s">restore relevant rule</text>
<rect x="770" y="88" width="190" height="84" rx="14" class="b good"/><text x="865" y="116" text-anchor="middle" class="h">4 · SUCCEED</text><text x="865" y="140" text-anchor="middle" class="s">avoid the old error</text>
<circle r="8" fill="#60a5fa"><animateMotion dur="9s" repeatCount="indefinite" path="M170 130 H270 H460 H520 H710 H770 H830" keyTimes="0;0.12;0.28;0.40;0.56;0.68;0.84;1" keyPoints="0;0.15;0.44;0.53;0.82;0.91;1;1" calcMode="linear"/></circle>
<path d="M865 188C865 225 125 225 125 188" class="l" opacity=".25"/><text x="495" y="229" text-anchor="middle" class="s">next task → recall first → fewer repeated mistakes</text>
</svg>