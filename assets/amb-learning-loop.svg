<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" height="100%" role="img" aria-label="Agent Memory Bridge Governed Memory Loop">
  <defs>
    <linearGradient id="ambGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
    .header-title { font-size: 19px; font-weight: 700; fill: #f8fafc; letter-spacing: 0.5px; }
    .header-sub { font-size: 12px; font-weight: 500; fill: #94a3b8; }
    .card-title { font-size: 13px; font-weight: 700; }
    .card-sub { font-size: 11px; fill: #94a3b8; }
    .step-badge { font-size: 10px; font-weight: 700; fill: #64748b; letter-spacing: 0.8px; }
    .conn-line { fill: none; stroke: #334155; stroke-width: 2; stroke-dasharray: 6 6; }
    .loop-text { font-size: 11px; fill: #64748b; font-weight: 500; }
    .card-bg-standard { fill: url(#cardGrad); stroke-width: 1.8; }
    .card-bg-highlight { fill: url(#ambGlow); stroke: #38bdf8; stroke-width: 2.2; }
    .badge-bg { fill: #0369a1; }
    .badge-text { fill: #f8fafc; }
    .box1-color { stroke: #f43f5e; fill: #f43f5e; }
    .box2-color { stroke: #38bdf8; fill: #38bdf8; }
    .box3-color { stroke: #38bdf8; fill: #f8fafc; }
    .box4-color { stroke: #10b981; fill: #34d399; }
    .signal-color { fill: #38bdf8; }

    @media (prefers-color-scheme: light) {
      .header-title { fill: #0f172a; }
      .header-sub { fill: #475569; }
      .card-sub { fill: #475569; }
      .conn-line { stroke: #cbd5e1; }
      .loop-text { fill: #64748b; }
      .card-bg-standard { fill: #ffffff; }
      .card-bg-highlight { fill: #f0f9ff; stroke: #0284c7; }
      .badge-bg { fill: #0284c7; }
      .badge-text { fill: #ffffff; }
      .box1-color { stroke: #e11d48; fill: #e11d48; }
      .box2-color { stroke: #0284c7; fill: #0284c7; }
      .box3-color { stroke: #0284c7; fill: #0f172a; }
      .box4-color { stroke: #059669; fill: #059669; }
      .signal-color { fill: #0284c7; }
    }

    @media (prefers-reduced-motion: reduce) {
      .motion-element { display: none !important; }
    }
  </style>

  <!-- Title &amp; Subtitle -->
  <text x="32" y="32" class="header-title">Agent Memory Bridge &#183; Governed Memory Loop</text>
  <text x="32" y="52" class="header-sub">Reviewed experience preserved into durable rules &amp; recalled across sessions</text>

  <!-- Connecting dashed line -->
  <path d="M 125 132 H 875" fill="none" class="conn-line" />

  <!-- Box 1: OBSERVATION / INCIDENT -->
  <g>
    <rect x="32" y="86" width="186" height="92" rx="10" class="card-bg-standard box1-color" stroke-opacity="0.85" />
    <text x="46" y="108" class="step-badge">STEP 01</text>
    <text x="46" y="128" class="card-title box1-color">OBSERVATION</text>
    <text x="46" y="148" class="card-sub">Task error or new</text>
    <text x="46" y="162" class="card-sub">runtime constraint</text>
  </g>

  <!-- Box 2: REVIEW &amp; STORE -->
  <g>
    <rect x="258" y="86" width="194" height="92" rx="10" class="card-bg-standard box2-color" stroke-opacity="0.8" />
    <text x="272" y="108" class="step-badge">STEP 02</text>
    <text x="272" y="128" class="card-title box2-color">REVIEW &amp; STORE</text>
    <text x="272" y="148" class="card-sub">Audit lesson &#8594; durable</text>
    <text x="272" y="162" class="card-sub">gotcha in AMB</text>
  </g>

  <!-- Box 3: AMB RECALL (Core Substrate - Highlighted) -->
  <g>
    <rect x="492" y="74" width="220" height="116" rx="12" class="card-bg-highlight" filter="url(#glow)" />
    <rect x="632" y="84" width="68" height="18" rx="4" class="badge-bg" />
    <text x="666" y="96" text-anchor="middle" font-size="9" font-weight="700" class="badge-text">MCP CORE</text>
    <text x="508" y="98" class="step-badge box2-color">STEP 03</text>
    <text x="508" y="124" class="card-title box3-color" font-size="15">AMB RECALL</text>
    <text x="508" y="148" class="card-sub">Scoped recall restores</text>
    <text x="508" y="164" class="card-sub">verified rules to agent</text>
  </g>

  <!-- Box 4: VERIFIED EXECUTION -->
  <g>
    <rect x="752" y="86" width="216" height="92" rx="10" class="card-bg-standard box4-color" stroke-opacity="0.85" />
    <text x="766" y="108" class="step-badge">STEP 04</text>
    <text x="766" y="128" class="card-title box4-color">VERIFIED EXECUTION</text>
    <text x="766" y="148" class="card-sub">Guided run avoids</text>
    <text x="766" y="162" class="card-sub">known traps &amp; loops</text>
  </g>

  <!-- Return Loop Path -->
  <path d="M 860 188 C 860 236 125 236 125 188" fill="none" class="conn-line" stroke-opacity="0.5" />
  <text x="500" y="240" text-anchor="middle" class="loop-text">
    new session begins  &#8594;  targeted recall first  &#8594;  fewer repeated failures
  </text>

  <!-- Animated Moving Signal Packet -->
  <circle r="7" class="motion-element signal-color" filter="url(#glow)">
    <animateMotion dur="8s" repeatCount="indefinite"
      path="M 125 132 H 355 H 602 H 860 V 188 C 860 236 125 236 125 188 V 132 Z"
      keyTimes="0; 0.22; 0.48; 0.72; 1"
      keyPoints="0; 0.25; 0.52; 0.75; 1"
      calcMode="linear" />
  </circle>
  <circle r="3" fill="#ffffff" class="motion-element">
    <animateMotion dur="8s" repeatCount="indefinite"
      path="M 125 132 H 355 H 602 H 860 V 188 C 860 236 125 236 125 188 V 132 Z"
      keyTimes="0; 0.22; 0.48; 0.72; 1"
      keyPoints="0; 0.25; 0.52; 0.75; 1"
      calcMode="linear" />
  </circle>
</svg>
