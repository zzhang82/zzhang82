<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="bodyGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="windowShadowLight" x="-2%" y="-2%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <style>
    text {
      font-family: ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace;
    }
    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(4px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .l1 { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards; opacity: 0; }
    .l2 { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.65s forwards; opacity: 0; }
    .l3 { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.25s forwards; opacity: 0; }
    .l4 { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.75s forwards; opacity: 0; }
    .l5 { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) 2.25s forwards; opacity: 0; }
    .l6 { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) 2.85s forwards; opacity: 0; }
    .l7 { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) 3.35s forwards; opacity: 0; }
    .l8 { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) 3.85s forwards; opacity: 0; }
    .cursor { animation: blink 1.1s step-start infinite 4.2s; opacity: 0; }

    @media (prefers-reduced-motion: reduce) {
      .l1, .l2, .l3, .l4, .l5, .l6, .l7, .l8, .cursor {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>

  <!-- Terminal Window Background -->
  <g filter="url(#windowShadowLight)">
    <rect x="4" y="4" width="892" height="300" rx="12" fill="url(#bodyGradLight)" stroke="#cbd5e1" stroke-width="1.5" />
    <path d="M 4 16 C 4 9.37 9.37 4 16 4 L 884 4 C 890.63 4 896 9.37 896 16 L 896 40 L 4 40 Z" fill="url(#headerGradLight)" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="4" y1="40" x2="896" y2="40" stroke="#cbd5e1" stroke-width="1.5" />
  </g>

  <!-- Window Dots -->
  <circle cx="26" cy="22" r="6" fill="#f43f5e" />
  <circle cx="46" cy="22" r="6" fill="#f59e0b" />
  <circle cx="66" cy="22" r="6" fill="#10b981" />

  <!-- Title -->
  <text x="450" y="26" text-anchor="middle" font-size="12" font-weight="600" fill="#475569" letter-spacing="0.5">frank@github &#8212; zsh</text>

  <!-- Terminal Body Content -->
  <!-- Line 1: whoami command -->
  <g class="l1">
    <text x="32" y="72" font-size="14">
      <tspan fill="#0284c7" font-weight="700">&#x276f; </tspan>
      <tspan fill="#0f172a" font-weight="600">whoami</tspan>
    </text>
  </g>

  <!-- Line 2: Identity summary -->
  <g class="l2">
    <text x="48" y="98" font-size="14">
      <tspan fill="#0369a1" font-weight="700">Frank Zhang</tspan>
      <tspan fill="#64748b"> &#8212; </tspan>
      <tspan fill="#334155" font-weight="500">Platform Engineering</tspan>
      <tspan fill="#94a3b8"> &#183; </tspan>
      <tspan fill="#334155" font-weight="500">AI Infrastructure</tspan>
      <tspan fill="#94a3b8"> &#183; </tspan>
      <tspan fill="#334155" font-weight="500">Automation</tspan>
    </text>
  </g>

  <!-- Line 3: status command -->
  <g class="l3">
    <text x="32" y="132" font-size="14">
      <tspan fill="#0284c7" font-weight="700">&#x276f; </tspan>
      <tspan fill="#0f172a" font-weight="600">sys --status</tspan>
    </text>
  </g>

  <!-- Line 4: System focus -->
  <g class="l4">
    <text x="48" y="158" font-size="13">
      <tspan fill="#059669">&#x25cf;</tspan>
      <tspan fill="#475569"> status: </tspan>
      <tspan fill="#059669" font-weight="600">active</tspan>
      <tspan fill="#94a3b8"> | </tspan>
      <tspan fill="#475569">focus: </tspan>
      <tspan fill="#0f172a">governed agent memory, runtime control planes, self-healing systems</tspan>
    </text>
  </g>

  <!-- Line 5: Easter Egg -->
  <g class="l5">
    <text x="48" y="184" font-size="13">
      <tspan fill="#d97706">&#x26a1;</tspan>
      <tspan fill="#64748b"> daily baseline: </tspan>
      <tspan fill="#334155">100 push-ups, 100 sit-ups, 100 squats, 10 km running</tspan>
    </text>
  </g>

  <!-- Line 6: explore command -->
  <g class="l6">
    <text x="32" y="218" font-size="14">
      <tspan fill="#0284c7" font-weight="700">&#x276f; </tspan>
      <tspan fill="#0f172a" font-weight="600">./explore --systems</tspan>
    </text>
  </g>

  <!-- Line 7: Systems loaded -->
  <g class="l7">
    <text x="48" y="244" font-size="13">
      <tspan fill="#059669" font-weight="700">[&#x2713;]</tspan>
      <tspan fill="#475569"> 4 systems: </tspan>
      <tspan fill="#0284c7" font-weight="600">Agent Memory Bridge</tspan>
      <tspan fill="#94a3b8"> &#183; </tspan>
      <tspan fill="#0284c7" font-weight="600">Ambu</tspan>
      <tspan fill="#94a3b8"> &#183; </tspan>
      <tspan fill="#0284c7" font-weight="600">Aegis Skills</tspan>
      <tspan fill="#94a3b8"> &#183; </tspan>
      <tspan fill="#0284c7" font-weight="600">NAS-Pulse</tspan>
    </text>
  </g>

  <!-- Line 8: Ready prompt + blinking cursor -->
  <g class="l8">
    <text x="32" y="278" font-size="14">
      <tspan fill="#0284c7" font-weight="700">&#x276f; </tspan>
      <tspan class="cursor" fill="#0284c7">&#x2588;</tspan>
    </text>
  </g>
</svg>