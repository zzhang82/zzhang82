<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <linearGradient id="pillGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="cardShadowDark" x="-2%" y="-4%" width="104%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    text {
      font-family: ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace;
    }
    .card {
      transition: all 0.25s ease;
    }
    .card:hover rect.card-bg {
      stroke: #38bdf8;
      stroke-width: 1.5;
    }
  </style>

  <!-- Section Header -->
  <text x="16" y="22" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">SELECTED SYSTEMS // CORE ARCHITECTURE</text>
  <text x="884" y="22" text-anchor="end" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">4 PRODUCTION REPOSITORIES</text>
  <line x1="16" y1="32" x2="884" y2="32" stroke="#1e293b" stroke-width="1.5" />

  <!-- Card 1: Agent Memory Bridge -->
  <g class="card">
    <rect class="card-bg" x="16" y="44" width="426" height="126" rx="10" fill="url(#cardGradDark)" stroke="#1e293b" stroke-width="1.5" filter="url(#cardShadowDark)" />
    <rect x="330" y="56" width="98" height="20" rx="4" fill="url(#pillGradDark)" stroke="#334155" stroke-width="1" />
    <text x="379" y="70" text-anchor="middle" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="0.5">MCP SERVER</text>
    <text x="32" y="70" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="0.8">01 / PLATFORM MEMORY</text>
    <text x="32" y="96" font-size="16" font-weight="700" fill="#f8fafc">Agent Memory Bridge</text>
    <text x="32" y="118" font-size="12" fill="#94a3b8">Governed memory across coding sessions &amp; verified learning</text>
    <text x="32" y="148" font-size="11">
      <tspan fill="#38bdf8" font-weight="600">TypeScript</tspan>
      <tspan fill="#475569"> | </tspan>
      <tspan fill="#cbd5e1">MCP Protocol</tspan>
      <tspan fill="#475569"> | </tspan>
      <tspan fill="#cbd5e1">SQLite / Vector</tspan>
      <tspan fill="#475569"> | </tspan>
      <tspan fill="#34d399">Governed-v2</tspan>
    </text>
  </g>

  <!-- Card 2: Ambu -->
  <g class="card">
    <rect class="card-bg" x="458" y="44" width="426" height="126" rx="10" fill="url(#cardGradDark)" stroke="#1e293b" stroke-width="1.5" filter="url(#cardShadowDark)" />
    <rect x="760" y="56" width="110" height="20" rx="4" fill="url(#pillGradDark)" stroke="#334155" stroke-width="1" />
    <text x="815" y="70" text-anchor="middle" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="0.5">CONTROL PLANE</text>
    <text x="474" y="70" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="0.8">02 / RUNTIME AGENTS</text>
    <text x="474" y="96" font-size="16" font-weight="700" fill="#f8fafc">Ambu</text>
    <text x="474" y="118" font-size="12" fill="#94a3b8">Bounded repair &amp; execution verification with dynamic role routing</text>
    <text x="474" y="148" font-size="11">
      <tspan fill="#38bdf8" font-weight="600">Rust / TS</tspan>
      <tspan fill="#475569"> | </tspan>
      <tspan fill="#cbd5e1">Anti-Loop Guard</tspan>
      <tspan fill="#475569"> | </tspan>
      <tspan fill="#cbd5e1">Role Routing</tspan>
      <tspan fill="#475569"> | </tspan>
      <tspan fill="#34d399">Verified Run</tspan>
    </text>
  </g>

  <!-- Card 3: Aegis Skills -->
  <g class="card">
    <rect class="card-bg" x="16" y="180" width="426" height="126" rx="10" fill="url(#cardGradDark)" stroke="#1e293b" stroke-width="1.5" filter="url(#cardShadowDark)" />
    <rect x="334" y="192" width="94" height="20" rx="4" fill="url(#pillGradDark)" stroke="#334155" stroke-width="1" />
    <text x="381" y="206" text-anchor="middle" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="0.5">SECURITY</text>
    <text x="32" y="206" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="0.8">03 / OS AUTOMATION</text>
    <text x="32" y="232" font-size="16" font-weight="700" fill="#f8fafc">Aegis Skills (agentic-linux-wsl-kit)</text>
    <text x="32" y="254" font-size="12" fill="#94a3b8">Safer automation, OS hygiene &amp; forensic guardrails for Linux/WSL</text>
    <text x="32" y="284" font-size="11">
      <tspan fill="#38bdf8" font-weight="600">Bash / Python</tspan>
      <tspan fill="#475569"> | </tspan>
      <tspan fill="#cbd5e1">Linux / WSL2</tspan>
      <tspan fill="#475569"> | </tspan>
      <tspan fill="#cbd5e1">Audit Gates</tspan>
      <tspan fill="#475569"> | </tspan>
      <tspan fill="#34d399">Hardened</tspan>
    </text>
  </g>

  <!-- Card 4: NAS-Pulse -->
  <g class="card">
    <rect class="card-bg" x="458" y="180" width="426" height="126" rx="10" fill="url(#cardGradDark)" stroke="#1e293b" stroke-width="1.5" filter="url(#cardShadowDark)" />
    <rect x="760" y="192" width="110" height="20" rx="4" fill="url(#pillGradDark)" stroke="#334155" stroke-width="1" />
    <text x="815" y="206" text-anchor="middle" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="0.5">OBSERVABILITY</text>
    <text x="474" y="206" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="0.8">04 / INFRASTRUCTURE</text>
    <text x="474" y="232" font-size="16" font-weight="700" fill="#f8fafc">NAS-Pulse</text>
    <text x="474" y="254" font-size="12" fill="#94a3b8">Real-time clinical vitals for Synology NAS hardware &amp; Docker hygiene</text>
    <text x="474" y="284" font-size="11">
      <tspan fill="#38bdf8" font-weight="600">Go / Python</tspan>
      <tspan fill="#475569"> | </tspan>
      <tspan fill="#cbd5e1">Synology DSM</tspan>
      <tspan fill="#475569"> | </tspan>
      <tspan fill="#cbd5e1">Docker Vitals</tspan>
      <tspan fill="#475569"> | </tspan>
      <tspan fill="#34d399">Clinical</tspan>
    </text>
  </g>
</svg>