<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161f30" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="bodyGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <filter id="windowShadowDark" x="-2%" y="-2%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <style>
    text {
      font-family: ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace;
    }
    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(4px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .l1 { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards; opacity: 0; }
    .l2 { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.65s forwards; opacity: 0; }
    .l3 { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.25s forwards; opacity: 0; }
    .l4 { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.75s forwards; opacity: 0; }
    .l5 { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) 2.25s forwards; opacity: 0; }
    .l6 { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) 2.85s forwards; opacity: 0; }
    .l7 { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) 3.35s forwards; opacity: 0; }
    .l8 { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) 3.85s forwards; opacity: 0; }
    .cursor { animation: blink 1.1s step-start infinite 4.2s; opacity: 0; }

    @media (prefers-reduced-motion: reduce) {
      .l1, .l2, .l3, .l4, .l5, .l6, .l7, .l8, .cursor {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>

  <!-- Terminal Window Background -->
  <g filter="url(#windowShadowDark)">
    <rect x="4" y="4" width="892" height="300" rx="12" fill="url(#bodyGradDark)" stroke="#1e293b" stroke-width="1.5" />
    <path d="M 4 16 C 4 9.37 9.37 4 16 4 L 884 4 C 890.63 4 896 9.37 896 16 L 896 40 L 4 40 Z" fill="url(#headerGradDark)" stroke="#1e293b" stroke-width="1.5" />
    <line x1="4" y1="40" x2="896" y2="40" stroke="#1e293b" stroke-width="1.5" />
  </g>

  <!-- Window Dots -->
  <circle cx="26" cy="22" r="6" fill="#f43f5e" />
  <circle cx="46" cy="22" r="6" fill="#f59e0b" />
  <circle cx="66" cy="22" r="6" fill="#10b981" />

  <!-- Title -->
  <text x="450" y="26" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b" letter-spacing="0.5">frank@github &#8212; zsh</text>

  <!-- Terminal Body Content -->
  <!-- Line 1: whoami command -->
  <g class="l1">
    <text x="32" y="72" font-size="14">
      <tspan fill="#38bdf8" font-weight="700">&#x276f; </tspan>
      <tspan fill="#f8fafc" font-weight="600">whoami</tspan>
    </text>
  </g>

  <!-- Line 2: Identity summary -->
  <g class="l2">
    <text x="48" y="98" font-size="14">
      <tspan fill="#38bdf8" font-weight="700">Frank Zhang</tspan>
      <tspan fill="#64748b"> &#8212; </tspan>
      <tspan fill="#cbd5e1" font-weight="500">Platform Engineering</tspan>
      <tspan fill="#475569"> &#183; </tspan>
      <tspan fill="#cbd5e1" font-weight="500">AI Infrastructure</tspan>
      <tspan fill="#475569"> &#183; </tspan>
      <tspan fill="#cbd5e1" font-weight="500">Automation</tspan>
    </text>
  </g>

  <!-- Line 3: status command -->
  <g class="l3">
    <text x="32" y="132" font-size="14">
      <tspan fill="#38bdf8" font-weight="700">&#x276f; </tspan>
      <tspan fill="#f8fafc" font-weight="600">sys --status</tspan>
    </text>
  </g>

  <!-- Line 4: System focus -->
  <g class="l4">
    <text x="48" y="158" font-size="13">
      <tspan fill="#10b981">&#x25cf;</tspan>
      <tspan fill="#64748b"> status: </tspan>
      <tspan fill="#34d399" font-weight="600">active</tspan>
      <tspan fill="#475569"> | </tspan>
      <tspan fill="#64748b">focus: </tspan>
      <tspan fill="#e2e8f0">governed agent memory, runtime control planes, self-healing systems</tspan>
    </text>
  </g>

  <!-- Line 5: Easter Egg -->
  <g class="l5">
    <text x="48" y="184" font-size="13">
      <tspan fill="#f59e0b">&#x26a1;</tspan>
      <tspan fill="#64748b"> daily baseline: </tspan>
      <tspan fill="#94a3b8">100 push-ups, 100 sit-ups, 100 squats, 10 km running</tspan>
    </text>
  </g>

  <!-- Line 6: explore command -->
  <g class="l6">
    <text x="32" y="218" font-size="14">
      <tspan fill="#38bdf8" font-weight="700">&#x276f; </tspan>
      <tspan fill="#f8fafc" font-weight="600">./explore --systems</tspan>
    </text>
  </g>

  <!-- Line 7: Systems loaded -->
  <g class="l7">
    <text x="48" y="244" font-size="13">
      <tspan fill="#10b981" font-weight="700">[&#x2713;]</tspan>
      <tspan fill="#64748b"> 4 systems: </tspan>
      <tspan fill="#38bdf8" font-weight="600">Agent Memory Bridge</tspan>
      <tspan fill="#475569"> &#183; </tspan>
      <tspan fill="#38bdf8" font-weight="600">Ambu</tspan>
      <tspan fill="#475569"> &#183; </tspan>
      <tspan fill="#38bdf8" font-weight="600">Aegis Skills</tspan>
      <tspan fill="#475569"> &#183; </tspan>
      <tspan fill="#38bdf8" font-weight="600">NAS-Pulse</tspan>
    </text>
  </g>

  <!-- Line 8: Ready prompt + blinking cursor -->
  <g class="l8">
    <text x="32" y="278" font-size="14">
      <tspan fill="#38bdf8" font-weight="700">&#x276f; </tspan>
      <tspan class="cursor" fill="#38bdf8">&#x2588;</tspan>
    </text>
  </g>
</svg>